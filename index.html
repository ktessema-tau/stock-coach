<style>
:root {
  --page: #EEF2F0; --surface: #FFFFFF; --ink: #1C2B33; --soft: #5A6B74; --line: #D5DEDA;
  --teal: #1F5E6B; --buy: #2D7A55; --sell: #B23A3A; --hold: #50606D; --watch: #9A6F12; --avoid: #7A4C7E;
  --urgent-bg: #FBECEC;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #141D24; --surface: #1C2832; --ink: #E4EBEE; --soft: #98A9B2; --line: #2C3B46;
    --teal: #6FB3C1; --buy: #5FC08D; --sell: #F07B72; --hold: #A7B6C2; --watch: #E2B550; --avoid: #C79BCB;
    --urgent-bg: #3A2226;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 20px 110px; }
h1, h2, .verb, .big { font-family: "Fraunces", Georgia, serif; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 34px; line-height: 1.1; margin: 0 0 4px; }
h2 { font-size: 22px; margin: 32px 0 10px; }
p { margin: 0 0 12px; max-width: 34em; }
.soft { color: var(--soft); font-size: 15px; }
button { font: inherit; color: inherit; cursor: pointer; }
